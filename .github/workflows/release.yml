name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/hyper-workspace

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev \
            libasound2-dev libudev-dev \
            libgtk-3-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          lookup-only: true

      - name: Run tests
        run: .github/scripts/test-ci.sh

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    env:
      TARGET: ${{ matrix.target }}
      ARTIFACT: ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: synaps-cad-linux-x86_64.tar.gz
          - name: macOS Apple Silicon
            os: macos-latest
            target: aarch64-apple-darwin
            artifact: synaps-cad-macos-aarch64.tar.gz
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            artifact: synaps-cad-macos-x86_64.tar.gz
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: synaps-cad-windows-x86_64.zip

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: ./.github/actions/hyper-workspace

      - name: Install Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --target "${TARGET}"
          rustup default stable

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libwayland-dev libxkbcommon-dev \
            libasound2-dev libudev-dev \
            libgtk-3-dev

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: ${{ matrix.target }}
          lookup-only: true

      - name: Build
        shell: bash
        run: cargo build --locked --release --target "${TARGET}"

      - name: Package (macOS .app bundle)
        if: runner.os == 'macOS'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP="SynapsCAD.app"
          mkdir -p "$APP/Contents/MacOS"
          mkdir -p "$APP/Contents/Resources"
          cp "target/${TARGET}/release/synaps-cad" "$APP/Contents/MacOS/"
          cp assets/icon.icns "$APP/Contents/Resources/icon.icns"
          sed "s/\${APP_VERSION}/$VERSION/g" assets/macos/Info.plist > "$APP/Contents/Info.plist"
          # Ad-hoc code sign so macOS doesn't block the app
          codesign --force --deep -s - "$APP"
          tar czf "${ARTIFACT}" "$APP"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd "target/${TARGET}/release"
          tar czf "../../../${ARTIFACT}" synaps-cad
          cd ../../..

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "target/$env:TARGET/release/synaps-cad.exe" -DestinationPath $env:ARTIFACT

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create the GitHub release.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the section for the current tag's version from CHANGELOG.md
          VERSION="${GITHUB_REF_NAME#v}"
          # Get everything between this version's header and the next version header
          NOTES=$(awk "/^## \[${VERSION}\]/{found=1; next} /^## \[/{if(found) exit} found{print}" CHANGELOG.md)
          # Write to file to avoid escaping issues
          echo "$NOTES" > release_notes.md

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" artifacts/* --notes-file release_notes.md --verify-tag
